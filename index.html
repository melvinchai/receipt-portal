<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt Processing Portal</title>
  
  <!-- Mobile & PWA Fullscreen Capability -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <link rel="manifest" href="manifest.json">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe 
    id="appFrame"
    allow="camera; microphone; geolocation">
  </iframe>

  <script>
    // Base Google Apps Script Web App URL
    const baseUrl = "https://script.google.com/macros/s/AKfycbw6Ud2GOZwPeB9GtrBLIz135nXZBoS1zhk1nX_NKpsm3_Z4PoTJWyGI-hRZWilIu0PfaQ/exec";
    
    // Grab current URL parameters (e.g. ?user=USR-EAFC2)
    const currentParams = window.location.search;
    
    // Dynamically set iframe src with parameters attached
    document.getElementById('appFrame').src = baseUrl + currentParams;
  </script>
</body>
</html>
